name: Build Web App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build dist folder
        run: |
          npm ci
          npm run build

      - name: Upload dist zip
        uses: actions/upload-artifact@v4
        with:
          name: decimen-dist-folder
          path: dist/
